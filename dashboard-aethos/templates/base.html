<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dashboard SDR{% endblock %} · Aethos Sistemas</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Estilos do projeto -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body class="{% block body_class %}{% endblock %}">

  <!-- ═══════════════ CABEÇALHO ═══════════════ -->
  <header class="header">
    <div class="container header__inner">
      <div class="brand">
        <div class="brand__icon" aria-hidden="true">{% block header_icon %}{% endblock %}</div>
        <div>
          <p class="brand__company">Aethos Sistemas</p>
          <h1 class="brand__title">{% block header_title %}Dashboard SDR{% endblock %}</h1>
        </div>
      </div>
      <nav class="header__actions">
        {% block header_actions %}{% endblock %}
      </nav>
    </div>
    <div class="header__line"></div>
  </header>

  <!-- ═══════════════ CONTEÚDO ═══════════════ -->
  {% block content %}{% endblock %}

  <!-- ═══════════════ RODAPÉ ═══════════════ -->
  <footer class="container footer">
    <p>© <span id="ano-atual"></span> Aethos Sistemas · Dashboard SDR</p>
    <p>Dados via n8n · atualização automática</p>
  </footer>

  <!-- Bibliotecas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <!-- Scripts do projeto -->
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
