<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dashboard SDR{% endblock %} · Aethos Sistemas</title>
  <meta name="theme-color" content="#1A2836" />

  <!-- Ícone da Aethos (o mesmo do site oficial) -->
  <link rel="icon" href="{{ logo_url }}" />

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Estilos do projeto -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>

  <!-- ═══════════════ CABEÇALHO ═══════════════ -->
  <header class="header">
    <div class="container header__inner">

      <a class="brand" href="/" aria-label="Dashboard SDR Aethos Sistemas">
        <span class="brand__mark">
          <img src="{{ logo_url }}" alt="" width="40" height="40" onerror="this.parentElement.classList.add('is-fallback'); this.remove();" />
        </span>
        <span class="brand__text">
          <span class="brand__company">Aethos <strong>Sistemas</strong></span>
          <span class="brand__title">Dashboard SDR</span>
        </span>
      </a>

      <nav class="tabs" aria-label="Páginas do painel">
        <a href="/" class="tabs__item {% if pagina == 'mensal' %}is-active{% endif %}" {% if pagina == 'mensal' %}aria-current="page"{% endif %}>Mensal</a>
        <a href="/visao-anual" class="tabs__item {% if pagina == 'anual' %}is-active{% endif %}" {% if pagina == 'anual' %}aria-current="page"{% endif %}>Anual</a>
      </nav>

      <div class="header__meta">
        {% block header_meta %}{% endblock %}
        {% if pagina %}
        <button type="button" class="btn-atualizar" id="btn-atualizar" data-pagina="{{ pagina }}" title="Buscar os números mais recentes das planilhas agora">
          <svg class="btn-atualizar__icone" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
          </svg>
          <span class="btn-atualizar__texto">Atualizar agora</span>
        </button>
        {% endif %}
      </div>
    </div>
  </header>

  <!-- ═══════════════ CONTEÚDO ═══════════════ -->
  {% block content %}{% endblock %}

  <!-- Aviso do botão "Atualizar agora" -->
  <div class="aviso" id="aviso-atualizar" role="status" aria-live="polite" hidden></div>

  <!-- ═══════════════ RODAPÉ ═══════════════ -->
  <footer class="container footer">
    <p>© <span id="ano-atual"></span> Aethos Sistemas · Dashboard SDR</p>
    <p>Dados via n8n · atualização automática a cada 6 horas</p>
  </footer>

  <!-- Bibliotecas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <!-- Scripts do projeto -->
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/atualizar.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
