{% extends 'base.html' %}

{% block title %}Visão Anual{% endblock %}

{% block content %}
  <section class="dashboard-shell">
    <div class="section-header">
      <div>
        <p class="section-kicker">Histórico</p>
        <h2>Visão Anual</h2>
      </div>
      <span class="badge badge-neutral">Consolidado</span>
    </div>

    <div class="summary-grid" id="annual-summary" data-annual='{{ dados_anuais | tojson | safe }}'>
      <div class="card">
        <span class="label">Total Geral</span>
        <strong id="annual-total">0</strong>
      </div>
      <div class="card">
        <span class="label">Facebook</span>
        <strong id="annual-facebook">0</strong>
      </div>
      <div class="card">
        <span class="label">Orgânico</span>
        <strong id="annual-organico">0</strong>
      </div>
    </div>

    <div class="panel-grid">
      <article class="panel panel-wide">
        <h3>Leads por Mês</h3>
        <canvas id="chart-annual-trends" height="220"></canvas>
      </article>

      <article class="panel panel-wide">
        <h3>Qualidade por Canal</h3>
        <canvas id="chart-annual-quality" height="220"></canvas>
      </article>
    </div>
  </section>
{% endblock %}

{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/visao_anual.js') }}" defer></script>
{% endblock %}
